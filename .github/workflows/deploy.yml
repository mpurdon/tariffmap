name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    # Weekly refresh of trade data + rebuild, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  # Also started by the curation auto-merge workflow (pushes made with the
  # workflow token do not trigger `push`).
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Cache-first on every run: anything already in data/cache is reused, and only
      # what is missing (new HS codes, new partners) or expired is fetched. Offline-only
      # push builds used to leave arcs blank whenever a curation change added codes.
      - name: Build data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run build:data
      - name: Commit refreshed trade caches
        run: |
          git add data/cache
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "tariffmap-bot"
          git config user.email "bot@tariffmap.org"
          git commit -m "chore: refresh trade data caches"
          git pull --rebase origin main
          git push origin HEAD:main
      - run: npx vite build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
