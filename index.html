<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>TariffMap — who is taxing whom</title>
    <meta name="description" content="A live, sourced map of the world's tariffs — who imposes them, who they hit, how much trade is affected, and how it changed month by month." />
    <link rel="canonical" href="https://tariffmap.org/" />
    <meta property="og:title" content="TariffMap — who is taxing whom" />
    <meta property="og:description" content="A live, sourced map of the world's tariffs: who imposes them, who they hit, and how much trade is affected." />
    <meta property="og:url" content="https://tariffmap.org/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23090d1a'/%3E%3Cpath d='M6 22 Q16 4 26 22' stroke='%233987e5' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='22' r='3' fill='%23e66767'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map"></div>
    <header id="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">TARIFF<b>MAP</b></span>
      </div>
      <div id="freshness" class="freshness"></div>
      <div id="modeBadge" class="mode-badge" hidden title="Provincial exports: Statistics Canada 12-10-0175 (trailing 12 months). State exports: US Census (annual). Arcs land on the regions that export the targeted goods to the imposing country.">Regional exposure — arcs land where the targeted goods are made</div>
      <div class="spacer"></div>
      <div class="controls">
        <label class="toggle"><input type="checkbox" id="motionToggle" checked /><span>Motion</span></label>
        <label class="toggle"><input type="checkbox" id="viewToggle" /><span>Globe</span></label>
        <button class="zen-btn" id="zenToggle" title="Zen mode — hide the interface (Z)">Zen</button>
      </div>
    </header>
    <button id="zenExit" class="zen-exit" title="Leave zen mode (Esc)" hidden>✕</button>
    <button id="feedToggle" class="feed-toggle" title="Collapse panel" aria-expanded="true"><span></span></button>
    <aside id="feed" class="feed"></aside>
    <div id="legend" class="legend"></div>
    <div id="timeline" class="timeline"></div>
    <div id="tooltip" class="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
